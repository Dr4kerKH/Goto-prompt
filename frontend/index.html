<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Goto-prompt</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "on-primary": "#003824", "tertiary": "#a8cfbc", "on-error": "#690005",
          "on-surface": "#dae2fd", "primary-fixed-dim": "#4edea3", "surface-tint": "#4edea3",
          "on-surface-variant": "#bbcabf", "surface-container-low": "#131b2e",
          "surface-dim": "#0b1326", "inverse-surface": "#dae2fd", "inverse-primary": "#006c49",
          "on-tertiary": "#113729", "surface-container": "#171f33", "on-background": "#dae2fd",
          "outline": "#86948a", "secondary": "#95d3ba", "on-primary-container": "#00422b",
          "on-primary-fixed": "#002113", "tertiary-container": "#84ab98",
          "on-tertiary-container": "#1b3f31", "on-secondary-fixed": "#002117",
          "surface-container-high": "#222a3d", "primary": "#4edea3",
          "inverse-on-surface": "#283044", "on-primary-fixed-variant": "#005236",
          "surface-container-lowest": "#060e20", "surface": "#0b1326",
          "surface-bright": "#31394d", "primary-fixed": "#6ffbbe", "secondary-fixed": "#b0f0d6",
          "error-container": "#93000a", "on-secondary": "#003829",
          "primary-container": "#10b981", "surface-container-highest": "#2d3449",
          "background": "#0b1326", "surface-variant": "#2d3449",
          "outline-variant": "#3c4a42", "error": "#ffb4ab",
          "on-secondary-container": "#83c2a9", "secondary-container": "#0b513d"
        },
        borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
        spacing: {
          "md": "16px", "sm": "8px", "container-max": "1200px",
          "unit": "4px", "xs": "4px", "xl": "40px", "lg": "24px", "chat-max": "800px"
        },
        fontFamily: {
          "h3": ["Space Grotesk"], "code": ["Space Grotesk"], "body-md": ["Manrope"],
          "h1": ["Space Grotesk"], "h2": ["Space Grotesk"], "label-sm": ["Manrope"], "body-lg": ["Manrope"]
        },
        fontSize: {
          "h3": ["24px", { lineHeight: "1.3", fontWeight: "500" }],
          "code": ["14px", { lineHeight: "1.5", fontWeight: "400" }],
          "body-md": ["16px", { lineHeight: "1.6", fontWeight: "400" }],
          "h1": ["48px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "700" }],
          "h2": ["32px", { lineHeight: "1.2", letterSpacing: "-0.01em", fontWeight: "600" }],
          "label-sm": ["13px", { lineHeight: "1.0", letterSpacing: "0.05em", fontWeight: "600" }],
          "body-lg": ["18px", { lineHeight: "1.6", fontWeight: "400" }]
        }
      }
    }
  }
</script>
<style>
  body {
    background-image: radial-gradient(circle at 50% 0%, rgba(78,222,163,0.15) 0%, rgba(11,19,38,1) 60%);
    background-color: #0b1326;
    min-height: 100vh;
  }
  .glass-panel {
    background: rgba(11,19,38,0.6);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .glow-button { box-shadow: 0 4px 20px rgba(78,222,163,0.2); }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .streaming-cursor::after {
    content: '▋';
    display: inline-block;
    animation: blink 0.7s infinite;
    color: #4edea3;
    margin-left: 1px;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .msg-enter { animation: fadeIn 0.25s ease-out forwards; }

  textarea::placeholder { color: rgba(187,202,191,0.4); }
  textarea:focus { outline: none; box-shadow: none; }
</style>
</head>
<body class="text-on-background flex flex-col h-screen overflow-hidden font-body-md text-body-md">

<!-- Top App Bar -->
<header class="flex items-center justify-center w-full px-lg py-md backdrop-blur-xl border-b border-white/10 z-10 relative bg-surface-container-low/40">
  <div class="flex items-center justify-between w-full max-w-container-max mx-auto">
    <div class="text-h3 font-h3 text-primary tracking-tight font-bold">Goto-prompt</div>
    <button id="refresh-btn" class="flex items-center gap-sm px-md py-sm rounded-full glass-panel text-on-surface hover:bg-white/5 transition-colors">
      <span class="material-symbols-outlined text-[18px]">refresh</span>
      <span class="font-label-sm text-label-sm">Refresh session</span>
    </button>
  </div>
</header>

<!-- Main Chat Canvas -->
<main id="chat-main" class="flex-1 overflow-y-auto w-full flex justify-center py-xl px-md scroll-smooth">
  <div id="chat-messages" class="w-full max-w-chat-max flex flex-col gap-lg pb-[140px]">

    <!-- Welcome screen -->
    <div id="welcome-section" class="flex flex-col items-center justify-center py-xl gap-md text-center opacity-80">
      <div class="w-16 h-16 rounded-full glass-panel flex items-center justify-center shadow-[0_0_30px_rgba(78,222,163,0.15)]">
        <span class="material-symbols-outlined text-[32px] text-primary" style="font-variation-settings:'FILL' 1">auto_awesome</span>
      </div>
      <h1 class="font-h2 text-h2 text-on-background mt-sm">Luminous Intelligence</h1>
      <p class="font-body-lg text-body-lg text-on-surface-variant max-w-md">Your expert prompt engineering assistant. Describe your task to begin.</p>
    </div>

  </div>
</main>

<!-- Bottom Input Area -->
<div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-background via-background/90 to-transparent pt-xl pb-lg px-md flex justify-center z-20">
  <div class="w-full max-w-chat-max">
    <div class="relative glass-panel bg-surface-container/30 backdrop-blur-xl rounded-xl shadow-2xl shadow-primary/5 focus-within:border-primary/50 transition-colors duration-300 border border-white/10">
      <textarea
        id="message-input"
        class="w-full bg-transparent border-none text-on-surface focus:ring-0 resize-none py-lg px-lg font-body-md text-body-md pr-[108px]"
        placeholder="Describe the prompt you need..."
        rows="1"
        style="min-height:64px;max-height:200px"
      ></textarea>
      <div class="absolute right-sm bottom-sm flex items-center gap-sm">
        <button id="mic-btn" class="p-sm text-on-surface-variant hover:text-primary transition-colors rounded-lg hover:bg-white/5" title="Voice input">
          <span class="material-symbols-outlined text-[20px]">mic</span>
        </button>
        <button id="send-btn" class="p-sm bg-primary text-on-primary rounded-lg hover:bg-primary-fixed-dim transition-colors glow-button flex items-center justify-center h-10 w-10">
          <span class="material-symbols-outlined text-[20px]" style="font-variation-settings:'FILL' 1">send</span>
        </button>
      </div>
    </div>
    <div class="text-center mt-sm">
      <span class="font-label-sm text-label-sm text-on-surface-variant/50">Goto-prompt uses local AI. Verify critical information.</span>
    </div>
  </div>
</div>

<!-- Refinement Modal (hidden by default) -->
<div id="refinement-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-md bg-background/80 backdrop-blur-sm">
  <div class="glass-panel bg-surface-container-high/60 backdrop-blur-xl w-full max-w-lg rounded-xl shadow-2xl overflow-hidden relative border border-white/20">

    <!-- Header -->
    <div class="flex items-center justify-between p-lg border-b border-white/10">
      <h2 class="font-h3 text-h3 text-on-background">Help me refine your prompt</h2>
      <button id="modal-close" class="p-xs text-on-surface-variant hover:text-primary transition-colors rounded-full hover:bg-white/5">
        <span class="material-symbols-outlined text-[24px]">close</span>
      </button>
    </div>

    <!-- Body -->
    <div class="p-lg flex flex-col gap-md">
      <p class="text-on-surface-variant">To provide better results, tell me more about your requirements:</p>
      <div class="grid grid-cols-1 gap-sm">

        <button data-focus="security" class="focus-option flex items-start gap-md p-md rounded-lg border border-white/10 bg-white/5 hover:bg-primary/10 hover:border-primary/30 transition-all text-left group">
          <div class="w-10 h-10 shrink-0 rounded-full bg-primary/20 flex items-center justify-center group-hover:scale-110 transition-transform">
            <span class="material-symbols-outlined text-primary text-[20px]">security</span>
          </div>
          <div>
            <div class="font-bold text-on-surface">Focus on Security</div>
            <div class="text-label-sm text-on-surface-variant">Prioritize OWASP top 10 and data protection.</div>
          </div>
        </button>

        <button data-focus="performance" class="focus-option flex items-start gap-md p-md rounded-lg border border-white/10 bg-white/5 hover:bg-primary/10 hover:border-primary/30 transition-all text-left group">
          <div class="w-10 h-10 shrink-0 rounded-full bg-primary/20 flex items-center justify-center group-hover:scale-110 transition-transform">
            <span class="material-symbols-outlined text-primary text-[20px]">speed</span>
          </div>
          <div>
            <div class="font-bold text-on-surface">Focus on Performance</div>
            <div class="text-label-sm text-on-surface-variant">Optimize for speed, efficiency, and caching.</div>
          </div>
        </button>

        <button data-focus="best_practices" class="focus-option flex items-start gap-md p-md rounded-lg border border-white/10 bg-white/5 hover:bg-primary/10 hover:border-primary/30 transition-all text-left group">
          <div class="w-10 h-10 shrink-0 rounded-full bg-primary/20 flex items-center justify-center group-hover:scale-110 transition-transform">
            <span class="material-symbols-outlined text-primary text-[20px]">architecture</span>
          </div>
          <div>
            <div class="font-bold text-on-surface">Focus on Best Practices</div>
            <div class="text-label-sm text-on-surface-variant">Ensure clean architecture and maintainability.</div>
          </div>
        </button>

        <!-- Custom Focus -->
        <div class="flex flex-col gap-sm p-md rounded-lg border border-white/10 bg-white/5">
          <button data-focus="custom" class="focus-option flex items-start gap-md text-left group w-full">
            <div class="w-10 h-10 shrink-0 rounded-full bg-primary/20 flex items-center justify-center group-hover:scale-110 transition-transform">
              <span class="material-symbols-outlined text-primary text-[20px]">edit</span>
            </div>
            <div>
              <div class="font-bold text-on-surface">Custom Focus</div>
              <div class="text-label-sm text-on-surface-variant">Define your own focus area.</div>
            </div>
          </button>
          <div id="custom-input-container" class="hidden pl-[56px] flex flex-col gap-sm">
            <input
              id="custom-focus-input"
              type="text"
              placeholder="e.g., accessibility, i18n, GraphQL pagination…"
              class="w-full bg-surface-container-lowest/60 rounded-lg px-md py-sm border border-outline-variant text-on-surface focus:border-primary/50 focus:ring-0 font-body-md text-body-md"
            />
            <button id="custom-focus-submit" class="self-start px-md py-sm rounded-full bg-primary text-on-primary font-label-sm text-label-sm hover:bg-primary-fixed-dim transition-colors glow-button">
              Apply
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- Footer -->
    <div class="p-lg pt-0 flex justify-end">
      <button id="modal-skip" class="px-lg py-sm rounded-full bg-primary text-on-primary font-label-sm text-label-sm hover:bg-primary-fixed-dim transition-colors glow-button">
        Skip for now
      </button>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
